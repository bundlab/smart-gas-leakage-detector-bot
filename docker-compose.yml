version: "3.9"

services:
  api:
    build: .
    container_name: gas_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: gas_db
    environment:
      POSTGRES_USER: gasuser
      POSTGRES_PASSWORD: gaspass
      POSTGRES_DB: gasdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
volumes:
  postgres_data:
